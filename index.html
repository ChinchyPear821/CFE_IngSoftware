<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - CFE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
        }
        .cfe-border {
            border: 2px solid #2e7d32; /* Borde verde de CFE */
        }
        .cfe-bg-header {
            background-color: #2e7d32; /* Fondo verde para el encabezado */
        }
        .cfe-text-green {
            color: #2e7d32; /* Color de texto verde para CFE */
        }
    </style>
</head>
<body class="bg-white d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5 text-center">
                
                <div class="mb-4">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_de_la_Comisi%C3%B3n_Federal_de_Electricidad_%28CFE%29.svg/1200px-Logo_de_la_Comisi%C3%B3n_Federal_de_Electricidad_%28CFE%29.svg.png" alt="Logo CFE" class="img-fluid" style="max-height: 80px;">
                </div>

                <div class="cfe-border rounded">
                    <div class="cfe-bg-header py-3">
                        <h2 class="h4 text-white mb-0">Sistema de facturación</h2>
                    </div>
                    <div class="p-4 bg-white">
                        <h3 class="h5 mb-4 text-dark">Inicio de sesión</h3>

                        <form>
                            <div class="text-start mb-2">
                                <label for="usuario" class="form-label text-dark">Usuario</label>
                                <input type="text" class="form-control" id="usuario" placeholder="Ingresar usuario">
                            </div>

                            <div class="text-start mb-3">
                                <label for="password" class="form-label text-dark">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="● ● ● ● ● ● ● ● ● ●">
                            </div>

                            <div class="d-flex justify-content-between mb-4">
                                <a href="#" class="cfe-text-green text-decoration-none small">Recuperar contraseña</a>
                                <a href="#" class="cfe-text-green text-decoration-none small">Cambio de contraseña</a>
                            </div>

                            <div class="d-grid">
                                <a href="./Lecturista/botonesLecturista.html" 
                                    type="submit" class="btn btn-success btn-lg" style="background-color: #2e7d32; border-color: #2e7d32;">
                                    <p>Iniciar</p>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
