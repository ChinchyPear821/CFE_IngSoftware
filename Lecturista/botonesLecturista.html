<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lecturista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .cfe-bg-green {
            background-color: #2e7d32; /* Tono de verde CFE */
        }
        .cfe-text-green {
            color: #2e7d32;
        }
        .cfe-border-green {
            border: 2px solid #2e7d32;
        }
        .logo-cfe-nav {
            height: 40px;
        }
        /* Estilo para los botones del menú */
        .menu-button {
            display: flex;
            align-items: center;
            padding: 1.5rem 1rem;
            text-decoration: none;
            color: #333;
            transition: background-color 0.2s;
        }
        .menu-button:hover {
            background-color: #f8f9fa;
            color: #2e7d32;
        }
        .menu-button i {
            font-size: 2rem;
            margin-right: 1rem;
            color: #6c757d; /* Color de icono gris */
        }
        .menu-button span {
            font-size: 1.1rem;
            font-weight: 500;
        }
        /* Centrar el logo en la navbar */
        .navbar-brand-centered {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body class="bg-white">

    <nav class="navbar navbar-dark cfe-bg-green px-3">
        <div class="container-fluid position-relative">
            
            <a href="#" class="navbar-toggler me-2 text-white" style="border: none; text-decoration: none;">
                <i class="bi bi-list fs-1"></i>
            </a>
            <span class="navbar-text text-white d-none d-md-inline">
                Bienvenido Genaro
            </span>

            <a class="navbar-brand navbar-brand-centered" href="#">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_de_la_Comisi%C3%B3n_Federal_de_Electricidad_%28CFE%29.svg/1200px-Logo_de_la_Comisi%C3%B3n_Federal_de_Electricidad_%28CFE%29.svg.png" 
                    alt="Logo CFE" class="logo-cfe-nav">
            </a>

            <a href="../index.html" class="nav-link text-white text-center ms-auto">
                <i class="bi bi-box-arrow-right fs-4"></i>
                <div class="small">Salir</div>
            </a>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row g-3 justify-content-center" style="max-width: 900px; margin: auto;">
            
            <div class="col-12 col-md-6">
                <a href="./listaServicios.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-list-task cfe-text-green"></i>
                    <span>Servicios asignados</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="./clandarioLecturista.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-calendar-event cfe-text-green"></i>
                    <span>Calendario</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="./historialLecturas.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-clock-history cfe-text-green"></i>
                    <span>Historial</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="./busquedaServicio.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-search cfe-text-green"></i>
                    <span>Búsqueda de servicio</span>
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
