<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - CFE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .cfe-bg-green {
            background-color: #2e7d32; /* Tono de verde CFE */
        }
        .cfe-text-green {
            color: #2e7d32;
        }
        .cfe-border-green {
            border: 2px solid #2e7d32 !important;
        }
        .logo-cfe-nav {
            height: 40px;
        }
        /* Centrar el logo en la navbar */
        .navbar-brand-centered {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        /* Estilo para el botón del menú */
        .menu-button {
            display: flex;
            align-items: center;
            padding: 1.5rem 1rem;
            text-decoration: none;
            color: #333;
            transition: background-color 0.2s;
            background-color: white; /* Asegurar fondo blanco */
        }
        .menu-button:hover {
            background-color: #f8f9fa;
            color: #2e7d32;
        }
        .menu-button i {
            font-size: 2rem;
            margin-right: 1rem;
            color: #6c757d; /* Color de icono gris */
        }
        .menu-button span {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Estilos del calendario (ahora en tabla) */
        .calendar-table {
            border: 2px solid #2e7d32; /* Borde verde exterior */
        }
        .calendar-table th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #2e7d32;
            color: #333;
            font-weight: bold;
        }
        .calendar-table td {
            width: 14.28%; /* 100% / 7 días */
            height: 90px;
            padding: 5px;
            vertical-align: top;
            position: relative;
            border: 1px solid #dee2e6; /* Borde de celda gris */
        }
        .calendar-day-number {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        .calendar-empty {
            background-color: #f8f9fa;
        }
        .day-mark {
            width: 8px;
            height: 8px;
            background-color: #2e7d32;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
            right: 8px;
        }
        .legend-mark {
            display: inline-block;
            width: 15px;
            height: 15px;
            background-color: #2e7d32;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body class="bg-white">

    <nav class="navbar navbar-dark cfe-bg-green px-3">
        <div class="container-fluid position-relative">
            <a href="#" class="navbar-toggler me-2 text-white" style="border: none; text-decoration: none;">
                <i class="bi bi-list fs-1"></i>
            </a>
            <span class="navbar-text text-white d-none d-md-inline">
                Bienvenido Genaro
            </span>
            <a class="navbar-brand navbar-brand-centered" href="./botonesLecturista.html">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_de_la_Comisi%C3%B3n_Federal_de_Electricidad_%28CFE%29.svg/1200px-Logo_de_la_Comisi%C3%B3n_Federal_de_Electricidad_%28CFE%29.svg.png" 
                    alt="Logo CFE" class="logo-cfe-nav">
            </a>
            <a href="../index.html" class="nav-link text-white text-center ms-auto">
                <i class="bi bi-box-arrow-right fs-4"></i>
                <div class="small">Salir</div>
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row g-3 justify-content-center">
            <div class="col-12 col-md-8">
                <a href="#" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-calendar-event cfe-text-green"></i>
                    <span>Calendario</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container mt-4" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0 cfe-text-green">Noviembre 2025</h3>
            <button class="btn btn-outline-success cfe-border-green cfe-text-green">Cambiar Mes</button>
        </div>

        <table class="table calendar-table">
            <thead>
                <tr class="text-center">
                    <th>Lun</th>
                    <th>Mar</th>
                    <th>Mié</th>
                    <th>Jue</th>
                    <th>Vie</th>
                    <th class="text-danger">Sáb</th>
                    <th class="text-danger">Dom</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="calendar-empty"></td>
                    <td class="calendar-empty"></td>
                    <td class="calendar-empty"></td>
                    <td class="calendar-empty"></td>
                    <td class="calendar-empty"></td>
                    <td><span class="calendar-day-number text-danger">1</span></td>
                    <td><span class="calendar-day-number text-danger">2</span></td>
                </tr>
                <tr>
                    <td><span class="calendar-day-number">3</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">4</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">5</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">6</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">7</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number text-danger">8</span></td>
                    <td><span class="calendar-day-number text-danger">9</span></td>
                </tr>
                <tr>
                    <td><span class="calendar-day-number">10</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">11</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">12</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">13</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">14</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number text-danger">15</span></td>
                    <td><span class="calendar-day-number text-danger">16</span></td>
                </tr>
                <tr>
                    <td><span class="calendar-day-number">17</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">18</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">19</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">20</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">21</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number text-danger">22</span></td>
                    <td><span class="calendar-day-number text-danger">23</span></td>
                </tr>
                <tr>
                    <td><span class="calendar-day-number">24</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">25</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">26</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">27</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number">28</span><div class="day-mark"></div></td>
                    <td><span class="calendar-day-number text-danger">29</span></td>
                    <td><span class="calendar-day-number text-danger">30</span></td>
                </tr>
            </tbody>
        </table>

        <div class="mt-4 text-center">
            <span class="legend-mark"></span>
            <span>Día con servicios asignados</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
