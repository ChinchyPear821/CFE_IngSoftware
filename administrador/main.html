<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lecturista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
    <style>
        /* Estilo para los botones del menú */
        .menu-button {
            display: flex;
            align-items: center;
            padding: 1.5rem 1rem;
            background-color: white;
            border-radius: 0.75rem;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease-in-out;
        }

        .menu-button:hover {
            background-color: #f1fdf3;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .menu-button i {
            font-size: 2.2rem;
            margin-right: 1rem;
            color: #2e7d32;
            transition: 0.2s;
        }

        .menu-button:hover i {
            transform: scale(1.1);
        }

        .menu-button span {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Centrar el logo en la navbar */
        .navbar-brand-centered {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-cfe {
            display: flex;
        }
    </style>
</head>

<body class="bg-white">

    <nav class="navbar navbar-dark cfe-bg-green px-3">
        <div class="container-fluid position-relative">

            <a href="#" class="navbar-toggler me-2 text-white" style="border: none; text-decoration: none;">
                <i class="bi bi-list fs-1"></i>
            </a>
            <span class="navbar-text text-white d-none d-md-inline">
                Bienvenido Juan Gabriel
            </span>

            <a class="navbar-brand navbar-brand-centered" href="#">
                <img src="../images/logoCFE.jpeg" alt="Logo CFE" class="logo-cfe-nav">
            </a>

            <a href="#" class="nav-link text-white text-center ms-auto">
                <i class="bi bi-box-arrow-right fs-4"></i>
                <div class="small">Salir</div>
            </a>
        </div>
    </nav>

    <div class="container-fluid border-bottom py-2 m-3">
        <h1 class="display-5 text-center">SISTEMA DE FACTURACIÓN</h1>
    </div>

    <div class="container mt-4">
        <div class="row g-3 justify-content-center" style="max-width: 900px; margin: auto;">

            <div class="col-12 col-md-6">
                <a href="./Recibos/listaRecibos.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-list-task cfe-text-green"></i>
                    <span>Recibos asignados</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="./buscarRecibo.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-search cfe-text-green"></i>
                    <span>Buscar Recibo</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="./reporte.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-card-heading cfe-text-green"></i>
                    <span>Generar Reporte</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="./historial.html" class="menu-button cfe-border-green rounded">
                    <i class="bi bi-clock-history cfe-text-green"></i>
                    <span>Historial</span>
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
