<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Servicios - CFE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="bg-white">

    <nav class="navbar navbar-dark cfe-bg-green px-3">

        <div class="container-fluid position-relative">
            <a href="#" class="navbar-toggler me-2 text-white" style="border: none; text-decoration: none;">
                <i class="bi bi-list fs-1"></i>
            </a>

            <a class="navbar-brand navbar-brand-centered" href="../main.html">
                <img src="../../images/logoCFE.jpeg" alt="Logo CFE" class="logo-cfe-nav">
            </a>

            <a href="../../index.html" class="nav-link text-white text-center ms-auto">
                <i class="bi bi-box-arrow-right fs-4"></i>
                <div class="small">Salir</div>
            </a>
        </div>

    </nav>

    <div class="container-fluid border-bottom py-2 m-3">
        <h1 class="display-5 text-center">VISTA PREVIA</h1>
    </div>

    <div class="container mt-4">

        <div class="row">
            <div class="col-6">
                <img class="img-fluid" src="../../images/administrador/frontalRecibo.jpg"
                    alt="Parte Delantera Recibo CFE">
            </div>

            <div class="col-6">
                <img class="img-fluid" src="../../images/administrador/traseroRecibo.jpg" alt="Parte Detras Recibo CFE">
            </div>
        </div>

        <div class="mt-4 d-flex justify-content-end gap-2">
            <a href="../main.html" class="btn-salir">Cancelar</a>
            <button type="button" class="btn btn-cfe" data-bs-toggle="modal" data-bs-target="#exampleModalCenter">
                Guardar Recibo
            </button>

        </div>

        <!--Modal-->
        <div class="modal fade" id="exampleModalCenter" tabindex="-1" aria-labelledby="exampleModalCenterTitle"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header m-3">
                        <h5 class="modal-title" id="exampleModalCenterTitle">Se guardó el archivo exitosamente</h5>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-cerrar" data-bs-dismiss="modal">Cerrar</button>
                        <a href="../main.html" class="btn-salir">Salir al Inicio</a>
                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
