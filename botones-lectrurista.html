<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lecturista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Color Pantone 347C (#008f39) */
        .cfe-bg-green {
            background-color: #008f39; 
        }
        .cfe-text-green {
            color: #008f39;
        }
        .cfe-border-green {
            border: 2px solid #008f39;
        }
        
        /* --- CAMBIO AQUÍ: Logo más grande --- */
        .logo-cfe-nav {
            height: 80px; /* Aumentado de 40px a 80px */
            width: auto;  /* Mantiene la proporción */
        }
        
        /* Estilo para los botones del menú */
        .menu-button {
            display: flex;
            align-items: center;
            padding: 1.5rem 1rem;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            background-color: white;
            border: 2px solid #008f39;
        }
        
        .menu-button:hover {
            background-color: #008f39;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 143, 57, 0.3);
        }
        
        .menu-button i {
            font-size: 2rem;
            margin-right: 1rem;
            color: #008f39;
            transition: color 0.3s ease;
        }
        
        .menu-button:hover i {
            color: white;
        }

        .menu-button span {
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .navbar-brand-centered {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body class="bg-white">

    <nav class="navbar navbar-dark cfe-bg-green px-3">
        <div class="container-fluid position-relative">
            
            <a href="#" class="navbar-toggler me-2 text-white" style="border: none; text-decoration: none;">
                <i class="bi bi-list fs-1"></i>
            </a>
            <span class="navbar-text text-white d-none d-md-inline">
                Bienvenido Genaro
            </span>

            <!-- CAMBIO AQUÍ: Nueva imagen del logo -->
            <a class="navbar-brand navbar-brand-centered" href="#">
                <img src="cfe-logo-png_seeklogo-28797.png" alt="Logo CFE" class="logo-cfe-nav">
            </a>

            <a href="login.html" class="nav-link text-white text-center ms-auto">
                <i class="bi bi-box-arrow-right fs-4"></i>
                <div class="small">Salir</div>
            </a>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row g-3 justify-content-center" style="max-width: 900px; margin: auto;">
            
            <div class="col-12 col-md-6">
                <a href="lista-servicios.html" class="menu-button rounded">
                    <i class="bi bi-list-task"></i>
                    <span>Servicios asignados</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="clandario-lecturista.html" class="menu-button rounded">
                    <i class="bi bi-calendar-event"></i>
                    <span>Calendario</span>
                </a>
            </div>
            
            <div class="col-12 col-md-6">
                <a href="rutas.html" class="menu-button rounded">
                    <i class="bi bi-cursor-fill"></i> 
                    <span>Rutas</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="historial-lecturas.html" class="menu-button rounded">
                    <i class="bi bi-clock-history"></i>
                    <span>Historial</span>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="busqueda-servicio.html" class="menu-button rounded">
                    <i class="bi bi-search"></i>
                    <span>Búsqueda de servicio</span>
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
