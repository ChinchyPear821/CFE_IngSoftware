<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Servicio - CFE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .cfe-bg-green { background-color: #008f39; }
        .cfe-text-green { color: #008f39; }
        .cfe-border-green { border: 2px solid #008f39 !important; }
        
        /* CAMBIO AQUÍ: Logo más grande */
        .logo-cfe-nav { height: 80px; width: auto; }
        
        .navbar-brand-centered { position: absolute; left: 50%; transform: translateX(-50%); }
        .info-label { font-weight: bold; color: #333; }
        .info-data { color: #6c757d; font-size: 1.1rem; }
        .btn-cfe { background-color: #008f39; border-color: #008f39; color: white; padding: 0.5rem 1.5rem; }
        .btn-cfe:hover { background-color: #006f29; border-color: #006f29; color: white; }
        .btn-cfe-dark { background-color: #1a431c; border-color: #1a431c; color: white; }
        .btn-cfe-dark:hover { background-color: #0e240f; border-color: #0e240f; color: white; }
        .btn-check:checked+.btn-outline-success { background-color: #008f39; color: white; }
        .btn-check:checked+.btn-outline-danger { background-color: #dc3545; color: white; }
        .btn-no-reporte{
            color: red;
            text-decoration: none
        }
    </style>
</head>

<body class="bg-white">

    <nav class="navbar navbar-dark cfe-bg-green px-3">
        <div class="container-fluid position-relative">
            <a href="#" class="navbar-toggler me-2 text-white" style="border: none; text-decoration: none;">
                <i class="bi bi-list fs-1"></i>
            </a>
            <span class="navbar-text text-white d-none d-md-inline">Bienvenido Genaro</span>
            
            <!-- CAMBIO AQUÍ: Nueva imagen del logo -->
            <a class="navbar-brand navbar-brand-centered" href="./botones-lectrurista.html">
                <img src="cfe-logo-png_seeklogo-28797.png" alt="Logo CFE" class="logo-cfe-nav">
            </a>
            
            <a href="./index.html" class="nav-link text-white text-center ms-auto">
                <i class="bi bi-box-arrow-right fs-4"></i>
                <div class="small">Salir</div>
            </a>
        </div>
    </nav>

    <div class="container-fluid border-bottom py-2">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <a href="lista-servicios.html" class="btn btn-link text-dark text-decoration-none me-2">
                    <i class="bi bi-list-task fs-4"></i>
                    <span class="d-none d-md-inline ms-1">Ver lista</span>
                </a>
                <a href="./rutas-optimas.html" class="btn btn-outline-success btn-sm border-0">
                    <i class="bi bi-signpost-split-fill fs-5"></i>
                    <span class="ms-1 fw-bold">Ver Ruta</span>
                </a>
            </div>
            
            <h2 class="h5 mb-0 text-secondary d-none d-sm-block">Servicios asignados</h2>

            <a href="#" class="btn btn-link text-dark text-decoration-none">
                <span class="me-2 fs-5">Siguiente</span>
                <i class="bi bi-arrow-right-circle-fill cfe-text-green fs-3"></i>
            </a>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-md-4 col-lg-3">
                <div class="mb-3">
                    <div class="info-label">Numero de servicio</div>
                    <div class="info-data">218484111</div>
                </div>
                <div class="mb-3">
                    <div class="info-label">Numero de medidor</div>
                    <div class="info-data">598797864</div>
                </div>
                <div class="mb-3">
                    <div class="info-label">Fecha</div>
                    <div class="info-data">30-Nov-2025</div>
                </div>
                
                <div class="mb-3" id="seccionLecturaManual">
                    <label for="lecturaManual" class="form-label info-label">Lectura (kwh)</label>
                    <input type="number" class="form-control cfe-border-green" id="lecturaManual" placeholder="Ingresar lectura">
                </div>
            </div>

            <div class="col-md-4 col-lg-5">
                <h5 class="info-label">Dirección</h5>
                <p class="mb-0"><strong>Interior:</strong> 05</p>
                <p class="mb-0"><strong>Exterior:</strong> 01</p>
                <p class="mb-0"><strong>Calle:</strong> Juárez</p>
                <p class="mb-0"><strong>Colonia:</strong> Benito</p>
                <p class="mb-0"><strong>Municipio/delegación:</strong> Amecameca</p>
                <p class="mb-0"><strong>Estado:</strong> Estado de México</p>
                <p class="mb-0"><strong>CP:</strong> 55011</p>
            </div>

            <div class="col-md-4 col-lg-4">
                <form onsubmit="return false;"> 
                    <div class="mb-3">
                        <label class="form-label info-label">Lectura tomada</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="lecturaTomada" id="btnLecturaSi" autocomplete="off" checked>
                            <label class="btn btn-outline-success cfe-border-green" for="btnLecturaSi">SI</label>

                                <input type="radio" class="btn-check" name="lecturaTomada" id="btnLecturaNo" autocomplete="off">                               
                                <a href="./reporte_lec_no.html" class="btn btn-outline-danger cfe-border-green" ><labelfor="btnLecturaNo">NO</label></a>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3" id="seccionReporte" style="display: none;">
                        <label for="observaciones" class="form-label info-label">Observaciones / Reporte</label>
                        <textarea class="form-control cfe-border-green" id="observaciones" rows="4"></textarea>
                    </div>

                    <button type="button" class="btn btn-cfe-dark btn-lg w-100" id="btnEnviar" data-bs-toggle="modal" data-bs-target="#successModal">
                        Enviar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title cfe-text-green" id="successModalLabel">Éxito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="modalMessage"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-cfe" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const btnSi = document.getElementById('btnLecturaSi');
        const btnNo = document.getElementById('btnLecturaNo');
        const seccionReporte = document.getElementById('seccionReporte');
        const seccionLectura = document.getElementById('seccionLecturaManual');

        function toggleReporteView() {
            if (btnNo.checked) {
                seccionReporte.style.display = 'block';
                seccionLectura.style.display = 'none';
            } else {
                seccionReporte.style.display = 'none';
                seccionLectura.style.display = 'block';
            }
        }

        btnSi.addEventListener('change', toggleReporteView);
        btnNo.addEventListener('change', toggleReporteView);

        const btnEnviar = document.getElementById('btnEnviar');
        const modalMessage = document.getElementById('modalMessage');

        btnEnviar.addEventListener('click', function() {
            if (btnNo.checked) {
                modalMessage.textContent = 'Envío de reporte enviado con éxito';
            } else {
                modalMessage.textContent = 'Lectura tomada con éxito';
            }
        });
    </script>
</body>
</html>
